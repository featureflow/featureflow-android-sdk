name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :featureflow:testDebugUnitTest

      - name: Assemble release
        run: ./gradlew :featureflow:assembleRelease

      # The example app is the only thing exercising the framework-dependent half of the SDK —
      # SharedPreferences caching, ProcessLifecycleOwner, polling. Left uncompiled it rots.
      - name: Build example app
        run: ./gradlew :example:assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: featureflow/build/reports/tests/

  publish-dry-run:
    name: Verify the publication builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # Catches a broken POM or a missing sources/javadoc jar here rather than at release,
      # when Central rejects the bundle and the tag is already public.
      - name: Publish to local Maven
        run: ./gradlew :featureflow:publishToMavenLocal

      - name: Check the expected artifacts exist
        run: |
          DIR=~/.m2/repository/io/featureflow/featureflow-android-sdk
          VERSION=$(ls "$DIR")
          echo "version: $VERSION"
          for ext in .aar -sources.jar -javadoc.jar .pom; do
            FILE="$DIR/$VERSION/featureflow-android-sdk-$VERSION$ext"
            [ -f "$FILE" ] || { echo "::error::missing $FILE"; exit 1; }
            echo "  ok $(basename "$FILE")"
          done
